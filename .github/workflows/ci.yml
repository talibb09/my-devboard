# Goal: Build the image for devboard frontend and push it to Docker Hub

name: CI

on:
  push:
    branches: [main]


jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-actions@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/my-devboard-fe-master:latest

