# Goal: Build the image for devboard frontend and push it to Docker Hub

name: CI

on:
  push:
    branches: [main]


jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Replace with your project's Node version
          cache: 'npm'       # Automatically caches dependencies for faster runs
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
  build-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend        # folder that holds the frontend code
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/my-devboard-fe-master:latest

